<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Cotizo Contigo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap">
<style>
/* Concepto: identidad "Tierra cálida": verde bosque, terracota y mostaza sobre crema, titulares en serif. Barra lateral verde bosque en escritorio, navegación inferior táctil en tableta/teléfono, resumen de total siempre visible. */
:root{
  --blue:#0B6B58;--fuchsia:#D9552B;--violet:#A8481F;--cyan:#C98A10;--lime:#C5D43F;--orange:#E2792C;--navy:#12372A;
  --bg:#FBF6EC;--surface:#FFFDF8;--surface2:#F3EBDC;--ink:#12372A;--muted:#5B6359;--line:#E6DCC8;
  --limeInk:#3F6212;--blueInk:#0B6B58;--violetInk:#8A3A16;--fuchsiaInk:#B2411A;--orangeInk:#B2411A;--cyanInk:#8A5A00;
  --shadow:0 1px 2px rgba(18,55,42,.05),0 10px 28px rgba(18,55,42,.07);
  --fh:'Fraunces',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A15;--surface:#17261F;--surface2:#1F3329;--ink:#F3F1EA;--muted:#B3C2B8;--line:#2C4237;
  --limeInk:#BEF264;--blueInk:#7FD1B9;--violetInk:#F0B58F;--fuchsiaInk:#F5B49A;--orangeInk:#FDBA74;--cyanInk:#F2CF7A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A15;--surface:#17261F;--surface2:#1F3329;--ink:#F3F1EA;--muted:#B3C2B8;--line:#2C4237;
  --limeInk:#BEF264;--blueInk:#7FD1B9;--violetInk:#F0B58F;--fuchsiaInk:#F5B49A;--orangeInk:#FDBA74;--cyanInk:#F2CF7A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
textarea,input{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--fh);margin:0;letter-spacing:-.01em;line-height:1.15;text-wrap:balance;color:var(--ink)}
p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.i{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.app{min-height:100vh}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--navy);color:#fff}
.top b{font-family:var(--fh);font-size:16px;font-weight:800}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.main{min-width:0}
.wrap{max-width:1120px;margin:0 auto;padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px));box-shadow:0 -8px 24px rgba(18,55,42,.08)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:12px;font-size:10.5px;font-weight:600;color:var(--muted);min-height:52px;min-width:0}
.bnav button.on{color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet))}
@media (min-width:900px){
  .top,.bnav,body::before{display:none}
  .side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:272px;background:linear-gradient(180deg,#12372A 0%,#1B4D3B 100%);color:#fff;padding:24px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:20;gap:6px;overflow-y:auto}
  .main{margin-left:272px}
  .wrap{padding-block:34px 60px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}
.brand b{font-family:var(--fh);font-weight:800;font-size:17px;line-height:1.1;display:block}
.brand small{color:#B3C2B8;font-size:12px}
.navb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;color:#CFE0D5;font-weight:600;min-height:48px;transition:background .2s,color .2s}
.navb:hover{background:rgba(255,255,255,.08);color:#fff}
.navb.on{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;box-shadow:0 8px 20px rgba(11,107,88,.35)}
.side-foot{margin-top:auto;padding:14px;border-radius:16px;background:rgba(255,255,255,.07);font-size:12.5px;color:#CFE0D5;display:flex;flex-direction:column;gap:8px}
.side-foot .bar{background:rgba(255,255,255,.15)}

/* primitives */
.ico{display:inline-grid;place-items:center;flex:none;width:var(--s,44px);height:var(--s,44px);border-radius:50%;background:var(--c,var(--blue));color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--c,var(--blue)) 35%,transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.pad{padding:20px}
@media(min-width:700px){.pad{padding:26px}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--violetInk)}
.h1{font-size:clamp(26px,4.4vw,40px);font-weight:800}
.h2{font-size:clamp(20px,2.6vw,26px);font-weight:800}
.h3{font-size:17px;font-weight:700}
.lead{color:var(--muted);font-size:16px;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 24px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .15s,box-shadow .2s,background .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn-hot{background:var(--fuchsia);color:#fff;box-shadow:0 10px 24px rgba(217,85,43,.38)}
.btn-hot:hover{background:#DB2777}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 10px 22px rgba(11,107,88,.3)}
.btn-p:hover{background:#0B6B58}
.btn-ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blueInk)}
.btn-glass{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.btn-glass:hover{background:rgba(255,255,255,.2)}
.btn-lime{background:var(--lime);color:var(--navy)}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-sm{min-height:42px;padding:0 18px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--lime) 30%,transparent);color:var(--limeInk)}
.pill.warn{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orangeInk)}
.pill.cy{background:color-mix(in srgb,var(--cyan) 18%,transparent);color:var(--cyanInk)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;width:var(--w,0%);border-radius:99px;background:var(--c,linear-gradient(90deg,var(--cyan),var(--blue)));animation:grow .9s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ringin{from{stroke-dashoffset:var(--C)}}
.view{display:flex;flex-direction:column;gap:22px;min-width:0}
.view.anim{animation:rise .35s ease both}
.noanim *{animation:none!important}
.ringw{position:relative;flex:none}
.ringw svg{display:block}
.rt{stroke:var(--surface2)}
.rv{stroke-linecap:round;animation:ringin 1s cubic-bezier(.2,.8,.2,1)}
.ringl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--fh);font-weight:800;font-size:22px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:30px;color:#fff;padding:28px 22px 26px;background:
  radial-gradient(600px 340px at 85% 10%,rgba(217,85,43,.55),transparent 60%),
  radial-gradient(520px 380px at 0% 100%,rgba(11,107,88,.7),transparent 60%),
  radial-gradient(500px 300px at 60% 110%,rgba(168,72,31,.6),transparent 60%),#12372A;
  display:grid;gap:26px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.hero{padding:48px 44px;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center}}
.hero h1{color:#fff;font-size:clamp(34px,6.6vw,60px);font-weight:800;line-height:1.02}
.hero h1 span{background:linear-gradient(90deg,#F2CF7A,#F0B58F,#F5B49A);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{color:#E3EFE7;font-size:17px;max-width:46ch}
.hero .tag{display:inline-flex;gap:8px;align-items:center;padding:6px 13px;border-radius:99px;background:rgba(255,255,255,.12);font-size:13px;font-weight:600;width:fit-content}
.art{position:relative;min-height:260px}
.art svg{width:100%;height:auto;display:block}
.fl{position:absolute;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:99px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:700;animation:floaty 5s ease-in-out infinite}
.benefit{display:flex;gap:14px;align-items:center;padding:16px}
.benefit b{font-family:var(--fh);font-size:18px;display:block;line-height:1.2}
.path{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.pstep{display:flex;gap:12px;align-items:flex-start;padding:16px;text-align:left;width:100%;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);transition:transform .15s,border-color .2s}
.pstep:hover{transform:translateY(-2px);border-color:var(--violet)}
.pstep.done{border-color:color-mix(in srgb,var(--lime) 70%,var(--line))}

/* diagnostic */
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:22px;height:8px;border-radius:99px;background:var(--surface2)}
.dots i.d{background:var(--lime)}
.dots i.c{background:var(--violet);width:34px}
.stmt{padding:18px;border-radius:18px;background:var(--surface2);display:flex;flex-direction:column;gap:14px}
.stmt p.q{font-weight:600;font-size:16.5px;line-height:1.4}
.opts{display:grid;gap:8px;grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:left;font-weight:600;transition:all .15s}
.opt:hover{border-color:var(--violet)}
.opt .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface2);font-family:var(--fh);font-weight:800;font-size:14px;flex:none}
.opt.sel{background:var(--violet);color:#fff;border-color:var(--violet);transform:scale(1.01);box-shadow:0 8px 18px rgba(168,72,31,.35)}
.opt.sel .n{background:#fff;color:var(--violetInk)}
@media(min-width:700px){.opts{grid-template-columns:repeat(5,1fr)}.opt{flex-direction:column;justify-content:center;text-align:center;padding:12px 6px;font-size:13px;gap:6px}}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--cyan) 12%,transparent);color:var(--ink);font-size:13.5px}
.note .i{color:var(--cyanInk);margin-top:2px}
.err{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orangeInk);font-weight:600;font-size:14px}
.err ul{margin:6px 0 0;padding-left:18px;font-weight:500}

/* results */
.banner{border-radius:28px;color:#fff;padding:26px 22px;background:linear-gradient(120deg,var(--blue),var(--violet) 55%,var(--fuchsia));display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner h1{color:#fff}
.banner .eyebrow{color:#E9D5FF}
.chartbox{width:100%;max-width:560px;margin:0 auto}
.chartbox svg{width:100%;height:auto;display:block}
.chartbox text{font-family:var(--fb);fill:var(--muted)}
.lgd{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));font-size:13px}
.lgd div{display:flex;align-items:center;gap:8px;min-width:0}
.lgd .nn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none;background:var(--c)}
.brow{display:grid;grid-template-columns:36px minmax(0,1fr) 52px;gap:10px;align-items:center}
.brow .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .vv{font-weight:800;font-family:var(--fh);text-align:right}
.scard{padding:18px;display:flex;flex-direction:column;gap:12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.scard::after{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.score{font-family:var(--fh);font-weight:800;font-size:28px}

/* dimensions */
.dcard{display:flex;flex-direction:column;gap:12px;text-align:left;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .18s,box-shadow .2s;width:100%;min-width:0}
.dcard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(18,55,42,.14)}
.dhead{border-radius:28px;color:#fff;padding:24px 22px;background:var(--c);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#12372A));display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dhead h1{color:#fff}
.dhead .ico{background:rgba(255,255,255,.22);box-shadow:none}
.sec{display:flex;flex-direction:column;gap:10px}
.sec .lab{display:flex;gap:10px;align-items:center}
.ta{width:100%;min-height:96px;resize:vertical;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);line-height:1.5}
.ta:focus{border-color:var(--c,var(--blue));outline:3px solid color-mix(in srgb,var(--c,var(--blue)) 25%,transparent)}
.tin{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.callout{padding:16px 18px;border-radius:18px;background:color-mix(in srgb,var(--c,var(--blue)) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--blue)) 28%,var(--line))}
.chk{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;border:2px solid var(--line);background:var(--surface);flex:none;color:transparent;transition:all .15s}
.chk[aria-checked="true"]{background:var(--lime);border-color:var(--lime);color:var(--navy)}
.chkrow{display:flex;gap:12px;align-items:center;min-height:48px;text-align:left;width:100%}

/* plan */
.week{border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.whead{display:flex;gap:14px;align-items:center;padding:18px 20px;color:#fff;background:var(--c)}
.whead h3{color:#fff}
.whead .ico{background:rgba(255,255,255,.22);box-shadow:none}
.task{padding:14px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--blueInk);list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.task summary::-webkit-details-marker{display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{aspect-ratio:1/1;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);position:relative;min-width:0}
.cell small{font-size:9.5px;font-weight:500;opacity:.8}
.cell.t{background:color-mix(in srgb,var(--blue) 14%,var(--surface2));color:var(--blueInk)}
.cell.p{background:color-mix(in srgb,var(--orange) 24%,var(--surface2));color:var(--orangeInk)}
.cell.k{background:var(--lime);color:var(--navy)}
.cell.now{outline:3px solid var(--fuchsia);outline-offset:1px}
.cell.hd{aspect-ratio:auto;background:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 0}
.cell.a1{background:color-mix(in srgb,var(--cyan) 30%,var(--surface2));color:var(--ink)}
.cell.a2{background:color-mix(in srgb,var(--blue) 55%,var(--surface2));color:#fff}
.cell.a3{background:var(--violet);color:#fff}
.cell.e{background:none}

/* progress */
.tile{padding:20px;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--fh);font-weight:800;font-size:40px;line-height:1}
.cols{display:flex;align-items:flex-end;gap:5px;height:150px;border-bottom:2px solid var(--line);padding-bottom:0}
.cols>div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:11px;color:var(--muted)}
.cols i{display:block;width:100%;max-width:26px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--violet),var(--blue));height:var(--h);animation:colin .8s cubic-bezier(.2,.8,.2,1);min-height:3px}
.cols i.z{background:var(--surface2)}
@keyframes colin{from{height:0}}
.dl{display:flex;gap:5px;margin-top:6px;font-size:11px;color:var(--muted)}
.dl span{flex:1;text-align:center;min-width:0}
.ach{display:flex;gap:14px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--surface);align-items:flex-start}
.ach.lock{opacity:.92}
.ach.lock .ico{background:var(--surface2);color:var(--muted);box-shadow:none}
.ach.un{border-color:color-mix(in srgb,var(--lime) 70%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--lime) 14%,var(--surface)),var(--surface))}
.hist{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}

/* journal */
.entry{padding:18px;border-radius:20px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.qa b{display:block;font-size:12.5px;color:var(--violetInk);margin-bottom:2px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:44px 22px;border-radius:26px;border:2px dashed var(--line);background:var(--surface)}
.empty p{max-width:44ch;color:var(--muted)}

/* reporte */
.cb{display:flex;gap:12px;align-items:center;min-height:46px;cursor:pointer}
.cb input{width:22px;height:22px;accent-color:var(--violet);flex:none}

/* cotizador */
.mny{white-space:nowrap}
.ferr{display:block;color:var(--orangeInk);font-size:12.5px;font-weight:600}
.ferr:empty{display:none}
.svc{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--surface)}

function calc(L,mode,at,aa,R){
  const dec=zeroDec(curCode(R)),rd=n=>dec?Math.round(n):Math.round(n*100)/100;

  const disc=discOn?rd(sub*pct(R.discPct)/100):0;

  const rec=presOn?rd(b1*pct(R.presPct)/100):0;

}

  s=String(s==null?'':s).replace(/[^\d.,]/g,'');if(!s)return null;

}

  <div class="col" style="gap:6px"><label for="s-detail"><b>Detalle adicional (opcional)</b></label><input class="tin" id="s-detail" data-f="sd:detail" value="${esc(d.detail)}" maxlength="120" placeholder="Ej.: Duración, entregables, materiales"></div>
  <div class="col" style="gap:8px"><b>Color</b><div class="swatches" role="group" aria-label="Color">${PAL.map(c=>`<button type="button" class="sw ${d.color===c?'on':''}" style="--c:${c}" data-act="sd-color" data-v="${c}" aria-label="Color ${c}" aria-pressed="${d.color===c}">${d.color===c?ic('check',18,3):''}</button>`).join('')}</div></div>
  <div class="col" style="gap:8px"><b>Ícono</b><div class="swatches" role="group" aria-label="Ícono">${SICONS.map(n=>`<button type="button" class="sw ico2 ${d.icon===n?'on':''}" data-act="sd-icon" data-v="${n}" aria-label="Ícono ${n}" aria-pressed="${d.icon===n}">${ic(n,20)}</button>`).join('')}</div></div>
  <div class="row"><button class="btn btn-p" data-act="sd-save">${ic('check',18)} Guardar servicio</button><button class="btn btn-ghost" data-act="sd-cancel">Cancelar</button></div></div>`;
}
function svcsCard(){
  const list=S.services.map(s=>`<div class="svc">${chip(s.icon,s.color,48)}<div class="col" style="gap:3px;flex:1"><b style="font-family:var(--fh);overflow-wrap:anywhere">${esc(s.name)}</b>${s.desc?`<span class="muted small">${esc(s.desc)}</span>`:''}${s.detail?`<span class="muted small">${esc(s.detail)}</span>`:''}<span class="mny" style="font-weight:800">${money(num(s.price),S.rules)} <span class="muted small">${UNITS[s.unit]}</span></span></div>
  <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn btn-ghost btn-sm" data-act="sd-edit" data-id="${s.id}" aria-label="Editar ${esc(s.name)}">${ic('pencil',15)}</button><button class="btn btn-ghost btn-sm" data-act="sd-del" data-id="${s.id}" aria-label="Eliminar ${esc(s.name)}">${ic('trash',15)}</button></div></div>`).join('');
  return `<section class="card pad col" style="gap:16px"><div class="row between"><div class="row">${chip('tag','#D9552B',44)}<div><h2 class="h2">Tus servicios y precios</h2><p class="muted small">Los valores los escribes tú. Puedes cambiarlos cuando quieras.</p></div></div>${ui.sd?'':`<button class="btn btn-hot btn-sm" data-act="sd-new">${ic('plus',16)} Agregar servicio</button>`}</div>
  ${ui.sd?svcForm():''}
  ${S.services.length?`<div class="col">${list}</div><p class="muted small">Si cambias un precio aquí, las cotizaciones que ya guardaste conservan el valor con el que se crearon.</p>`:(ui.sd?'':empty('tag','#D9552B','Aún no tienes servicios','Agrega el primero con su precio. Si prefieres ver cómo funciona, carga tres ejemplos marcados como "EJEMPLO"; luego los editas o eliminas.',`<button class="btn btn-hot" data-act="sd-new">${ic('plus',18)} Agregar mi primer servicio</button><button class="btn btn-ghost" data-act="sd-ex">Cargar ejemplos</button>`))}</section>`;
}
function ruleRow(on,key,icon,color,title,sub,inner){
  return `<div class="col" style="gap:12px;padding:14px;border-radius:18px;border:1px solid var(--line)"><label class="cb"><input type="checkbox" data-f="r:${key}" data-rr="1" ${on?'checked':''}><span class="row" style="gap:10px;flex-wrap:nowrap">${chip(icon,color,34)}<span><b>${title}</b><span class="muted small" style="display:block">${sub}</span></span></span></label>${on?inner:''}</div>`;
}
function rulesCard(){
  const R=S.rules;
  const pf=(id,key,label,ph)=>`<div class="col" style="gap:6px"><label for="${id}"><b>${label}</b></label><input class="tin" id="${id}" data-f="r:${key}" inputmode="decimal" value="${esc(R[key])}" maxlength="8" placeholder="${ph||''}" aria-describedby="fe-${key}">${fe(key)}</div>`;
  return `<section class="card pad col" style="gap:16px"><div class="row">${chip('percent','#A8481F',44)}<div><h2 class="h2">Tus reglas de cotización</h2><p class="muted small">Opcionales. Se aplican a las cotizaciones nuevas.</p></div></div>
  <div class="rowc"><div class="col" style="gap:6px"><label for="r-cur"><b>Moneda</b></label><select class="sel" id="r-cur" data-f="r:cur" data-rr="1">${CURS.map(c=>`<option value="${c[0]}" ${R.cur===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div>
  ${R.cur==='OTRA'?`<div class="col" style="gap:6px"><label for="r-cc"><b>Código de la moneda (3 letras)</b></label><input class="tin" id="r-cc" data-f="r:curCustom" value="${esc(R.curCustom)}" maxlength="3" placeholder="Ej.: BRL" style="text-transform:uppercase" aria-describedby="fe-curCustom">${fe('curCustom')}</div>`:''}</div>
  ${ruleRow(R.discOn,'discOn','trending-up','#65A30D','Descuento por volumen','Si el cliente toma varias unidades',`<div class="rowc">${pf('r-dp','discPct','Descuento (%)','10')}${pf('r-dm','discMin','Desde cuántas unidades','3')}</div>`)}
  ${ruleRow(R.presOn,'presOn','map-pin','#E2792C','Recargo por modalidad presencial','Traslados u otros costos','<div class="rowc">'+pf('r-pp','presPct','Recargo (%)','15')+'</div>')}
  ${ruleRow(R.taxOn,'taxOn','file-text','#C98A10','Impuesto','Solo si lo cobras tú',`<div class="rowc"><div class="col" style="gap:6px"><label for="r-tn"><b>Nombre del impuesto</b></label><input class="tin" id="r-tn" data-f="r:taxName" value="${esc(R.taxName)}" maxlength="20" placeholder="Ej.: IVA"></div>${pf('r-tp','taxPct','Porcentaje (%)','19')}</div>`)}
  <div class="rowc"><div class="col" style="gap:6px"><label for="r-val"><b>Validez de la cotización (días)</b></label><input class="tin" id="r-val" data-f="r:validity" inputmode="numeric" value="${esc(R.validity)}" maxlength="3" aria-describedby="fe-validity">${fe('validity')}</div></div>
  <div class="col" style="gap:6px"><label for="r-notes"><b>Condiciones que aparecen en el PDF (opcional)</b></label><textarea class="ta" id="r-notes" data-f="r:notes" maxlength="600" placeholder="Forma de pago, fechas, aclaraciones...">${esc(R.notes)}</textarea></div>
  <div class="note">${ic('info',18)}<span>Los porcentajes de ejemplo (10, 15, 19) son solo marcadores de campo: cada regla está apagada hasta que la actives y escribas tus valores.</span></div></section>`;
}
function vCatalog(){
  return `<div><span class="eyebrow">Mi catálogo</span><h1 class="h1" style="margin-top:6px">TUS SERVICIOS, TUS PRECIOS</h1><p class="lead" style="margin-top:8px">Aquí defines una vez lo que ofreces. Todo se guarda solo.</p></div>
${brandCard()}${svcsCard()}${rulesCard()}
${S.services.length?`<div><button class="btn btn-hot" data-act="go" data-v="quote">Crear una cotización ${ic('arrow-right',18)}</button></div>`:''}`;
}

/* ============ NUEVA COTIZACIÓN ============ */
const STEPS=[['user','Cliente'],['tag','Servicios'],['pencil','Detalles'],['file-text','Resumen']];
function stepper(n){return `<div class="steps4" role="list" aria-label="Pasos">${STEPS.map((s,i)=>`<div class="st ${i+1===n?'on':''}" role="listitem" ${i+1===n?'aria-current="step"':''}>${chip(i+1<n?'check':s[0],i+1<n?'#65A30D':(i+1===n?'#A8481F':'#94A3B8'),40)}<span>${s[1]}</span></div>`).join('')}</div>`}
function pseudoQ(d){return {...d,rules:S.rules}}
function liveInner(){
  const d=getDraft(),c=calcDraft(d);
  return `<span class="small" style="opacity:.9">Total estimado</span><div class="tt mny" data-live>${money(c.total,S.rules)}</div><span class="small" style="opacity:.9">${d.lines.length} ${d.lines.length===1?'servicio':'servicios'} · ${c.units} ${c.units===1?'unidad':'unidades'}</span>
  <div style="background:rgba(255,255,255,.14);border-radius:14px;padding:8px 12px;font-size:13px">${breakdown(c,S.rules,d).replace(/class="brk"/g,'class="brk" style="padding:3px 0;font-size:13px"')}</div>`;
}
function updLive(){
  const d=getDraft(),c=calcDraft(d),t=money(c.total,S.rules);
  document.querySelectorAll('[data-live]').forEach(e=>e.textContent=t);
  const a=document.getElementById('live-aside');if(a)a.innerHTML=liveInner();
  const u=document.getElementById('live-units');if(u)u.textContent=d.lines.length+(d.lines.length===1?' servicio':' servicios');
  c.rows.forEach((r,i)=>{const e=document.getElementById('ls-'+i);if(e)e.textContent=money(r.sub,S.rules)});
}
function liveBar(){const d=getDraft(),c=calcDraft(d);return `<div class="livebar" role="status"><div><span class="small" style="opacity:.9;display:block" id="live-units">${d.lines.length} ${d.lines.length===1?'servicio':'servicios'}</span><span class="small" style="opacity:.9">Total estimado</span></div><b class="mny" data-live>${money(c.total,S.rules)}</b></div>`}
function errBox(){return ui.qerr.length?`<div class="err" role="alert">${ui.qerr.length>1?'<ul>'+ui.qerr.map(e=>`<li>${e}</li>`).join('')+'</ul>':ui.qerr[0]}</div>`:''}
function pickCard(s,on){return `<button type="button" class="pick ${on?'on':''}" style="--c:${s.color}" data-act="pick" data-id="${s.id||s.sid}" aria-pressed="${on}"><span class="tick">${ic('check',18,3)}</span>${chip(s.icon,s.color,48)}<b style="font-family:var(--fh);overflow-wrap:anywhere;padding-right:30px">${esc(s.name)}</b>${s.desc?`<span class="muted small">${esc(s.desc)}</span>`:''}<span class="mny" style="font-weight:800">${money(num(s.price),S.rules)} <span class="muted small">${UNITS[s.unit]}</span></span></button>`}
function stepBody(d){
  const k=d.step;
  if(k===1)return `<section class="card pad col" style="gap:16px"><div class="row">${chip('user','#0B6B58',44)}<div><h2 class="h2">¿Para quién es?</h2><p class="muted small">Estos datos aparecen en el PDF.</p></div></div>
    <div class="col" style="gap:6px"><label for="c-subj"><b>Asunto o proyecto (opcional)</b></label><input class="tin" id="c-subj" data-f="q:subject" value="${esc(d.subject)}" maxlength="100" placeholder="Ej.: Programa de acompañamiento"></div>
    <div class="rowc"><div class="col" style="gap:6px"><label for="c-name"><b>Nombre de tu cliente</b></label><input class="tin" id="c-name" data-f="c:name" value="${esc(d.client.name)}" maxlength="80" autocomplete="off"${inv('cname')} aria-describedby="fe-cname">${fe('cname')}</div>
    <div class="col" style="gap:6px"><label for="c-co"><b>Empresa (opcional)</b></label><input class="tin" id="c-co" data-f="c:company" value="${esc(d.client.company)}" maxlength="80" autocomplete="off"></div></div>
    <div class="col" style="gap:6px"><label for="c-em"><b>Correo de tu cliente</b></label><input class="tin" id="c-em" data-f="c:email" type="email" inputmode="email" value="${esc(d.client.email)}" maxlength="120" autocomplete="off"${inv('cemail')} aria-describedby="fe-cemail">${fe('cemail')}</div></section>`;
  if(k===2){
    const ids=new Set(S.services.map(s=>s.id)),ghost=d.lines.filter(l=>!ids.has(l.sid));
    if(!S.services.length&&!ghost.length)return empty('tag','#D9552B','Primero carga tu catálogo','Para cotizar necesitas al menos un servicio con tu precio.',`<button class="btn btn-hot" data-act="go" data-v="catalog">Ir a Mi catálogo ${ic('arrow-right',18)}</button>`);
    return `<section class="col"><div class="row">${chip('tag','#D9552B',44)}<div><h2 class="h2">¿Qué vas a cotizar?</h2><p class="muted small">Toca los servicios que quieres incluir.</p></div></div>
    <div class="grid g3">${S.services.map(s=>pickCard(s,d.lines.some(l=>l.sid===s.id))).join('')}${ghost.map(l=>pickCard({...l,id:l.sid},true)).join('')}</div>${ghost.length?'<p class="muted small">Los servicios marcados que ya no están en tu catálogo conservan el precio con el que se cotizaron.</p>':''}</section>`;
  }
  if(k===3){
    const c=calcDraft(d),R=S.rules;
    return `<section class="card pad col" style="gap:6px"><div class="row" style="margin-bottom:6px">${chip('pencil','#A8481F',44)}<div><h2 class="h2">Cantidades</h2><p class="muted small">¿Cuántas unidades de cada servicio?</p></div></div>
    ${c.rows.map((r,i)=>`<div class="ln" style="align-items:center"><div class="row" style="flex-wrap:nowrap;gap:10px;min-width:0">${chip(r.icon||'briefcase',r.color,34)}<div style="min-width:0"><b style="overflow-wrap:anywhere">${esc(r.name)}</b><div class="muted small"><span class="mny">${money(num(r.price),R)}</span> · ${UNITS[r.unit]}</div></div></div>
    <div class="col" style="align-items:flex-end;gap:6px">${r.unit==='unico'?`<span class="muted small">Pago único (1)</span>`:`<div class="qty"><button type="button" data-act="qty-" data-i="${i}" aria-label="Menos">${ic('minus',18)}</button><input id="qi-${i}" data-f="qty:${i}" inputmode="numeric" value="${r.qty}" maxlength="3" aria-label="Cantidad de ${esc(r.name)}"><button type="button" data-act="qty+" data-i="${i}" aria-label="Más">${ic('plus',18)}</button></div>`}<b class="mny" id="ls-${i}">${money(r.sub,R)}</b>${fe('qty'+i)}</div></div>`).join('')}</section>
    <section class="card pad col" style="gap:14px"><div class="row">${chip('map-pin','#E2792C',44)}<div><h2 class="h2">Modalidad</h2><p class="muted small">${R.presOn?`La modalidad presencial suma un recargo de ${pct(R.presPct)}%.`:'No tienes recargo presencial activo en tus reglas.'}</p></div></div>
    <div class="mode"><button type="button" class="opt2 ${d.mode==='virtual'?'on':''}" data-act="mode" data-v="virtual" aria-pressed="${d.mode==='virtual'}">${chip('video','#C98A10',40)}<b>Virtual</b></button><button type="button" class="opt2 ${d.mode==='presencial'?'on':''}" data-act="mode" data-v="presencial" aria-pressed="${d.mode==='presencial'}">${chip('map-pin','#E2792C',40)}<b>Presencial</b></button></div></section>
    <section class="card pad col" style="gap:14px"><div class="row">${chip('percent','#65A30D',44)}<div><h2 class="h2">Ajuste manual (opcional)</h2><p class="muted small">Un descuento o cargo puntual para esta cotización, después de impuestos.</p></div></div>
    <div class="mode">${[['none','Ninguno'],['desc','Descuento'],['cargo','Cargo extra']].map(a=>`<button type="button" class="opt2 ${d.adjType===a[0]?'on':''}" data-act="adj" data-v="${a[0]}" aria-pressed="${d.adjType===a[0]}"><b>${a[1]}</b></button>`).join('')}</div>
    ${d.adjType!=='none'?`<div class="rowc"><div class="col" style="gap:6px"><label for="a-amt"><b>Valor (${esc(curCode(R))})</b></label><input class="tin" id="a-amt" data-f="q:adjAmt" inputmode="decimal" value="${esc(d.adjAmt)}" maxlength="18"${inv('adj')} aria-describedby="fe-adj">${fe('adj')}</div><div class="col" style="gap:6px"><label for="a-why"><b>Motivo (opcional)</b></label><input class="tin" id="a-why" data-f="q:adjWhy" value="${esc(d.adjWhy)}" maxlength="60" placeholder="Ej.: Cliente frecuente"></div></div>`:''}</section>`;
  }
  const c=calcDraft(d),q=pseudoQ(d),R=S.rules,saved=d.editId&&quoteById(d.editId);
  return `<section class="card pad col" style="gap:14px"><div class="row between"><div class="row">${chip('file-text','#0B6B58',44)}<div><h2 class="h2">Resumen</h2><p class="muted small">Revisa todo antes de guardar.</p></div></div>${saved?`<span class="pill ok">${qnum(saved.num)} guardada</span>`:''}</div>
  <div class="col" style="gap:2px"><b>${esc(d.client.name)}${d.client.company?' · '+esc(d.client.company):''}</b><span class="muted small">${esc(d.client.email)}${d.subject?' · '+esc(d.subject):''}</span></div>
  <div>${linesHtml(c,R)}</div><div>${breakdown(c,R,d)}</div>${totalBox(c,R)}
  <p class="muted small">Modalidad ${d.mode==='presencial'?'presencial':'virtual'} · Válida ${Math.max(1,Math.floor(num(R.validity))||15)} días · Valores en ${esc(curCode(R))}</p>
  ${ui.pdfErr?`<div class="err" role="alert">${esc(ui.pdfErr)}</div>`:''}${mailNote(saved)}
  <div class="row"><button class="btn btn-hot" data-act="q-save">${ic('check',18)} Guardar cotización</button><button class="btn btn-p" data-act="q-pdf">${ic('download',18)} Descargar PDF</button><button class="btn btn-ghost" data-act="q-mail">${ic('mail',18)} Enviar por email</button></div></section>`;
}
function mailNote(q){
  if(!ui.mailMsg||!q||ui.mailMsg!==q.id)return '';
  return `<div class="note">${ic('mail',18)}<span>Preparamos el correo para ${esc(q.client.email)}. <b>Recuerda adjuntar el PDF descargado (${esc(pdfName(q))})</b>: el correo no puede adjuntarlo solo. Si no se abrió tu programa de correo, copia la dirección y envíalo desde allí.</span></div>${q.status==='borrador'?`<div><button class="btn btn-ghost btn-sm" data-act="mark-sent" data-id="${q.id}">${ic('circle-check',16)} Marcar como enviada</button></div>`:''}`;
}
function vQuote(){
  const d=getDraft(),k=d.step,live=(k===2||k===3)&&(d.lines.length>0||k===3);
  const nav=`<div class="row between">${k>1?`<button class="btn btn-ghost" data-act="q-back">${ic('arrow-left',18)} Atrás</button>`:'<span></span>'}${k<4&&!(k===2&&!S.services.length&&!d.lines.length)?`<button class="btn btn-p" data-act="q-next">${k===3?'Ver resumen':'Continuar'} ${ic('arrow-right',18)}</button>`:''}</div>`;
  const main=`<div class="col" style="gap:20px">${errBox()}${stepBody(d)}${nav}</div>`;
  return `<div class="row between"><div><span class="eyebrow">Nueva cotización</span><h1 class="h1" style="margin-top:6px">${d.editId?'EDITAR COTIZACIÓN':'ARMA TU COTIZACIÓN'}</h1></div>${(d.lines.length||d.client.name||d.client.email||d.subject)?`<button class="btn btn-ghost btn-sm" data-act="q-reset-ask">${ic('refresh',16)} Empezar de nuevo</button>`:''}</div>
${stepper(k)}
${live?`<div class="wiz two">${main}<aside><div class="live" id="live-aside">${liveInner()}</div></aside></div>${liveBar()}`:`<div class="wiz">${main}</div>`}`;
}

/* ============ HISTORIAL Y DETALLE ============ */
function statusSel(q){return `<select class="sel" style="min-height:40px;width:auto" data-f="status:${q.id}" data-rr="1" aria-label="Estado de ${qnum(q.num)}">${STAT.map(s=>`<option value="${s[0]}" ${q.status===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select>`}
function qActions(q,full){return `<div class="row" style="gap:8px"><button class="btn btn-p btn-sm" data-act="h-pdf" data-id="${q.id}">${ic('download',15)} PDF</button><button class="btn btn-ghost btn-sm" data-act="h-mail" data-id="${q.id}">${ic('mail',15)} Email</button>${full?`<button class="btn btn-ghost btn-sm" data-act="h-edit" data-id="${q.id}">${ic('pencil',15)} Editar</button>`:''}<button class="btn btn-ghost btn-sm" data-act="h-dup" data-id="${q.id}">${ic('copy',15)} Duplicar</button><button class="btn btn-ghost btn-sm" data-act="h-del" data-id="${q.id}" aria-label="Eliminar ${qnum(q.num)}">${ic('trash',15)}</button></div>`}
function vList(){
  if(!S.quotes.length)return `<div><span class="eyebrow">Historial</span><h1 class="h1" style="margin-top:6px">MIS COTIZACIONES</h1></div>`+empty('folder','#0B6B58','Aún no has guardado cotizaciones','Cuando guardes una, aparecerá aquí con su estado, y podrás duplicarla, editarla o volver a descargar su PDF.',`<button class="btn btn-hot" data-act="go" data-v="quote">${ic('file-plus',18)} Crear mi primera cotización</button>`);
  const qs=[...S.quotes].sort((a,b)=>b.num-a.num);
  return `<div><span class="eyebrow">Historial</span><h1 class="h1" style="margin-top:6px">MIS COTIZACIONES</h1><p class="lead" style="margin-top:8px">Cambia el estado de cada una para seguir tu avance.</p></div>
<section class="grid g4">${STAT.map(s=>{const f=qs.filter(q=>q.status===s[0]);return `<div class="card tile" style="border-top:5px solid ${s[2]}"><span class="muted small">${s[1]}${f.length===1?'':'s'}</span><div class="big">${f.length}</div><span class="small mny" style="overflow-wrap:anywhere">${sumBy(f)}</span></div>`}).join('')}</section>
<section class="col">${qs.map(q=>{const c=calcQ(q);const st=STAT.find(s=>s[0]===q.status)||STAT[0];return `<article class="qcard"><div class="row between"><div style="min-width:0"><button class="btn-link" style="font-family:var(--fh);font-weight:800;font-size:17px;text-align:left;color:var(--ink);overflow-wrap:anywhere" data-act="h-open" data-id="${q.id}">${qnum(q.num)} · ${esc(q.client.company||q.client.name)}</button><div class="muted small">${esc(q.subject||q.client.name)} · ${fmt(q.date)}</div></div><b class="mny" style="font-family:var(--fh);font-size:20px">${money(c.total,q.rules)}</b></div>
<div class="row between"><div class="row">${statusSel(q)}<span class="${st[3]}">${st[1]}</span></div>${qActions(q,true)}</div></article>`}).join('')}</section>`;
}
function vDetail(){
  const q=quoteById(S.openQ);if(!q)return vList();
  const c=calcQ(q),R=q.rules,st=STAT.find(s=>s[0]===q.status)||STAT[0];
  return `<div class="row"><button class="btn btn-ghost btn-sm" data-act="go" data-v="list">${ic('arrow-left',16)} Mis cotizaciones</button></div>
<section class="card pad col" style="gap:14px"><div class="row between"><div><span class="eyebrow">${qnum(q.num)} · ${fmt(q.date)}</span><h1 class="h1" style="margin-top:6px;overflow-wrap:anywhere">${esc(q.client.company||q.client.name)}</h1><p class="muted">${esc(q.client.name)} · ${esc(q.client.email)}${q.subject?' · '+esc(q.subject):''}</p></div><div class="col" style="gap:6px;align-items:flex-start"><span class="small muted">Estado</span>${statusSel(q)}</div></div>
<div>${linesHtml(c,R)}</div><div>${breakdown(c,R,q)}</div>${totalBox(c,R)}
<p class="muted small">Modalidad ${q.mode==='presencial'?'presencial':'virtual'} · Válida ${Math.max(1,Math.floor(num(R.validity))||15)} días · Valores en ${esc(curCode(R))}</p>
${ui.pdfErr?`<div class="err" role="alert">${esc(ui.pdfErr)}</div>`:''}${mailNote(q)}
${qActions(q,true)}</section>`;
}

/* ============ CARCASA Y RENDER ============ */
const activeNav=()=>S.view==='qdetail'?'list':S.view;
function shell(content){
  const nav=NAV.map(n=>`<button class="navb ${activeNav()===n[0]?'on':''}" data-act="go" data-v="${n[0]}" ${activeNav()===n[0]?'aria-current="page"':''}>${ic(n[3],22)}<span>${n[1]}</span></button>`).join('');
  const bn=NAV.map(n=>`<button class="${activeNav()===n[0]?'on':''}" data-act="go" data-v="${n[0]}" aria-label="${n[1]}" ${activeNav()===n[0]?'aria-current="page"':''}>${ic(n[3],22)}<span>${n[2]}</span></button>`).join('');
  const modal=ui.modal?`<div class="modalbg" data-act="modal-bg"><div class="card modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="row">${chip('info','#E2792C',42)}<h3 class="h3" id="mt">${ui.modal.t}</h3></div><p class="muted">${ui.modal.p}</p><div class="row" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-act="modal-cancel">Cancelar</button><button class="btn btn-hot btn-sm" data-act="modal-ok">${ui.modal.ok}</button></div></div></div>`:'';
  const warn=ui.saveErr?`<div class="err" role="alert" style="margin-bottom:14px">Este navegador no nos deja guardar tus datos (¿modo privado?). Funcionarán mientras no cierres la pestaña; descarga tus PDF para no perder nada.</div>`:'';
  return `<div class="app"><aside class="side"><div class="brand">${chip('file-text','#A8481F',44)}<div><b>COTIZO CONTIGO</b><small>Tus precios, tu propuesta, a tu manera</small></div></div>${nav}
<div class="side-foot"><div class="row between"><b>Tu cuaderno</b></div><span>${S.services.length} ${S.services.length===1?'servicio':'servicios'} · ${S.quotes.length} ${S.quotes.length===1?'cotización':'cotizaciones'}</span></div></aside>
<header class="top">${chip('file-text','#A8481F',32)}<b>Cotizo Contigo</b></header>
<main class="main"><div class="wrap">${warn}<div class="view ${hasBar()?'hasbar':''}" id="view">${content}</div></div></main>
<nav class="bnav" aria-label="Navegación principal">${bn}</nav></div>${modal}`;
}
function hasBar(){if(S.view!=='quote')return false;const d=getDraft();return d.step===2||d.step===3}
function body(){switch(S.view){case'catalog':return vCatalog();case'quote':return vQuote();case'list':return vList();case'qdetail':return vDetail();default:return vHome()}}
function render(o){
  o=o||{};const y=window.scrollY,app=document.getElementById('app');
  try{app.innerHTML=shell(body())}
  catch(err){console.error(err);app.innerHTML=`<div style="padding:24px;max-width:520px;margin:40px auto"><div class="card pad col"><h2 class="h2">Algo no salió como esperábamos</h2><p class="muted">Tus datos siguen guardados. Vuelve al inicio e inténtalo de nuevo.</p><button class="btn btn-p" data-act="go" data-v="home">Volver al inicio</button></div></div>`}
  app.classList.toggle('noanim',!o.anim);
  const v=document.getElementById('view');if(v&&o.anim)v.classList.add('anim');
  window.scrollTo(0,o.top?0:y);
  const bad=document.querySelector('[aria-invalid="true"]');if(bad&&o.focus){bad.focus({preventScroll:false})}
}
function nav(v,id){
  S.view=v;if(id)S.openQ=id;ui.fe={};ui.qerr=[];ui.pdfErr='';ui.mailMsg=null;ui.logoErr='';
  if(v!=='catalog')ui.sd=null;
  persist();render({anim:true,top:true});
}
function openModal(t,p,ok,act,data){ui.modal={t,p,ok,act,data};render({})}
function closeModal(){ui.modal=null;render({})}

/* ============ ACCIONES ============ */
function validStep(d){
  ui.fe={};ui.qerr=[];const k=d.step;
  if(k===1){
    if(!d.client.name.trim())ui.fe.cname='Escribe el nombre de tu cliente.';
    if(!d.client.email.trim())ui.fe.cemail='Escribe el correo de tu cliente.';
    else if(!EMAIL_RE.test(d.client.email.trim()))ui.fe.cemail='Revisa el correo: debe verse como nombre@dominio.com.';
    if(!curOk(S.rules))ui.qerr.push('Tu moneda personalizada necesita un código de 3 letras. Corrígelo en <b>Mi catálogo</b>.');
  }
  if(k===2&&!d.lines.length)ui.qerr.push('Elige al menos un servicio para continuar.');
  if(k===3){
    if(d.adjType!=='none'){
      const v=parsePrice(d.adjAmt);
      if(v==null||v<=0)ui.fe.adj='Escribe un valor mayor que cero para el ajuste.';
      else d.adjAmt=String(Math.round(v*100)/100);
    }
    if(!Object.keys(ui.fe).length&&calcDraft(d).neg)ui.fe.adj='Con este ajuste el total quedaría negativo. Reduce el valor.';
  }
  return !Object.keys(ui.fe).length&&!ui.qerr.length;
}
function commitDraft(){
  const d=getDraft(),c=calcDraft(d);
  if(c.neg||!d.lines.length)return null;
  const body={subject:d.subject.trim(),client:{name:d.client.name.trim(),company:d.client.company.trim(),email:d.client.email.trim()},lines:d.lines.map(l=>({...l})),mode:d.mode,adjType:d.adjType,adjAmt:d.adjType==='none'?'':d.adjAmt,adjWhy:d.adjType==='none'?'':d.adjWhy.trim(),rules:{...S.rules}};
  let q=d.editId&&quoteById(d.editId);
  if(q)Object.assign(q,body);
  else{q={id:uid(),num:S.nextNum++,date:today(),status:'borrador',...body};S.quotes.push(q);d.editId=q.id}
  persist();return q;
}
async function doPdf(q){
  if(ui.busy)return;ui.busy=true;ui.pdfErr='';
  try{const doc=buildPdf(q);await savePdf(doc,pdfName(q));S.flags.pdf=true;persist();toast('PDF listo: '+pdfName(q))}
  catch(e){console.error(e);ui.pdfErr=e&&e.message==='nolib'?'No se pudo cargar el generador de PDF. Revisa tu conexión a internet e inténtalo de nuevo.':'No pudimos crear el PDF. Inténtalo de nuevo.';render({})}
  ui.busy=false;
}
function doMail(q){
  if(!EMAIL_RE.test((q.client.email||'').trim())){ui.pdfErr='El correo de tu cliente no es válido. Edita la cotización para corregirlo.';render({});return}
  const a=document.createElement('a');a.href=mailHref(q);a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);
  ui.mailMsg=q.id;ui.pdfErr='';render({});
}
function editFrom(q){
  S.draft={step:1,editId:q.id,subject:q.subject||'',client:{...q.client},lines:q.lines.map(l=>({...l})),mode:q.mode,adjType:q.adjType||'none',adjAmt:q.adjAmt||'',adjWhy:q.adjWhy||''};
  nav('quote');toast('Editando '+qnum(q.num)+'. Se usarán tus reglas actuales.');
}
function act(a,el){
  const id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case'go':return nav(v);
    case'reset-ask':return openModal('¿Borrar todos tus datos?','Se eliminarán tu marca, tu catálogo, tus reglas y todas tus cotizaciones de este navegador. No se puede deshacer.','Sí, borrar todo','reset');
    case'sd-new':ui.sd={id:null,name:'',desc:'',price:'',unit:'hora',detail:'',color:PAL[0],icon:'briefcase'};ui.fe={};return render({focus:false});
    case'sd-edit':{const s=S.services.find(x=>x.id===id);if(!s)return;ui.sd={...s};ui.fe={};render({});const f=document.getElementById('s-name');if(f)f.scrollIntoView({block:'center'});return}
    case'sd-cancel':ui.sd=null;ui.fe={};return render({});
    case'sd-color':ui.sd.color=v;return render({});
    case'sd-icon':ui.sd.icon=v;return render({});
    case'sd-save':{
      const d=ui.sd;ui.fe={};
      if(!d.name.trim())ui.fe.name='Escribe el nombre del servicio.';
      const p=parsePrice(d.price);
      if(!String(d.price).trim())ui.fe.price='Escribe tu precio.';
      else if(p==null||p<=0||p>1e12)ui.fe.price='Escribe un valor válido mayor que cero, por ejemplo 150000.';
      if(Object.keys(ui.fe).length)return render({focus:true});
      const rec={id:d.id||uid(),name:d.name.trim(),desc:d.desc.trim(),price:String(Math.round(p*100)/100),unit:d.unit,detail:d.detail.trim(),color:d.color,icon:d.icon};
      const i=S.services.findIndex(x=>x.id===rec.id);if(i>=0)S.services[i]=rec;else S.services.push(rec);
      ui.sd=null;persist();render({});return toast(i>=0?'Servicio actualizado':'Servicio agregado');
    }
    case'sd-del':{const s=S.services.find(x=>x.id===id);return openModal('¿Eliminar este servicio?',`"${esc(s?s.name:'')}" saldrá de tu catálogo. Tus cotizaciones guardadas no cambian.`,'Eliminar','delsvc',id)}
    case'sd-ex':EXAMPLES.forEach(e=>S.services.push({...e,id:uid()}));persist();render({});return toast('Ejemplos cargados. Edita los precios como quieras.');
    case'logo-del':S.brand.logo=null;persist();return render({});
    case'pick':{
      const d=getDraft(),i=d.lines.findIndex(l=>l.sid===id);
      if(i>=0)d.lines.splice(i,1);
      else{const s=S.services.find(x=>x.id===id);if(!s)return;d.lines.push({sid:s.id,name:s.name,desc:s.desc,detail:s.detail,price:s.price,unit:s.unit,color:s.color,icon:s.icon,qty:1})}
      ui.qerr=[];persist();render({});return;
    }
    case'qty-':case'qty+':{
      const d=getDraft(),l=d.lines[+el.dataset.i];if(!l)return;
      l.qty=Math.min(999,Math.max(1,l.qty+(a==='qty+'?1:-1)));
      const e=document.getElementById('qi-'+el.dataset.i);if(e)e.value=l.qty;persist();return updLive();
    }
    case'mode':getDraft().mode=v;persist();return render({});
    case'adj':{const d=getDraft();d.adjType=v;ui.fe={};persist();return render({})}
    case'q-next':{const d=getDraft();if(!validStep(d)){render({focus:true});return}
      d.step++;ui.fe={};ui.qerr=[];persist();return render({anim:true,top:true})}
    case'q-back':{const d=getDraft();d.step=Math.max(1,d.step-1);ui.fe={};ui.qerr=[];persist();return render({anim:true,top:true})}
    case'q-reset-ask':return openModal('¿Empezar de nuevo?','Se borrarán los datos de esta cotización en curso. Las cotizaciones ya guardadas no se tocan.','Sí, empezar de nuevo','qreset');
    case'q-save':{const q=commitDraft();if(!q){ui.qerr=['El total no puede ser negativo.'];return render({})}
      S.draft=null;ui.fe={};ui.qerr=[];toast('Cotización '+qnum(q.num)+' guardada');return nav('qdetail',q.id)}
    case'q-pdf':{const q=commitDraft();if(!q){ui.qerr=['El total no puede ser negativo.'];return render({})}render({});return doPdf(q)}
    case'q-mail':{const q=commitDraft();if(!q){ui.qerr=['El total no puede ser negativo.'];return render({})}return doMail(q)}
    case'h-open':return nav('qdetail',id);
    case'h-pdf':{const q=quoteById(id);if(q)doPdf(q);return}
    case'h-mail':{const q=quoteById(id);if(!q)return;if(S.view!=='qdetail')S.openQ=id;S.view='qdetail';return doMail(q)}
    case'h-edit':{const q=quoteById(id);if(q)editFrom(q);return}
    case'h-dup':{const q=quoteById(id);if(!q)return;const n={...JSON.parse(JSON.stringify(q)),id:uid(),num:S.nextNum++,date:today(),status:'borrador'};S.quotes.push(n);persist();toast('Duplicada como '+qnum(n.num));return nav('qdetail',n.id)}
    case'h-del':{const q=quoteById(id);return openModal('¿Eliminar esta cotización?',`${q?qnum(q.num):''} se borrará del historial.`,'Eliminar','delq',id)}
    case'mark-sent':{const q=quoteById(id);if(q){q.status='enviada';persist();ui.mailMsg=null;render({});toast('Marcada como enviada')}return}
    case'modal-cancel':return closeModal();
    case'modal-bg':if(el===event.target)closeModal();return;
    case'modal-ok':{const m=ui.modal;ui.modal=null;
      if(m.act==='reset'){try{localStorage.removeItem(KEY)}catch(e){}mem=null;S=DEF();ui.sd=null;ui.fe={};ui.qerr=[];render({anim:true,top:true});toast('Tus datos fueron borrados')}
      else if(m.act==='delsvc'){S.services=S.services.filter(s=>s.id!==m.data);persist();render({});toast('Servicio eliminado')}
      else if(m.act==='delq'){S.quotes=S.quotes.filter(q=>q.id!==m.data);if(S.draft&&S.draft.editId===m.data)S.draft.editId=null;if(S.view==='qdetail'){S.view='list'}persist();render({anim:true,top:true});toast('Cotización eliminada')}
      else if(m.act==='qreset'){S.draft=null;ui.fe={};ui.qerr=[];persist();render({anim:true,top:true})}
      return}
  }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;try{act(el.dataset.act,el)}catch(err){console.error(err);toast('Ocurrió un error. Intenta de nuevo.')}});

/* ----- logo ----- */
function loadLogo(file){
  ui.logoErr='';
  if(!file)return;
  if(!/^image\//.test(file.type)){ui.logoErr='Elige un archivo de imagen (PNG o JPG).';return render({})}
  if(file.size>8*1024*1024){ui.logoErr='La imagen pesa demasiado. Elige una de menos de 8 MB.';return render({})}
  const fr=new FileReader();
  fr.onerror=()=>{ui.logoErr='No pudimos leer la imagen.';render({})};
  fr.onload=()=>{
    const im=new Image();
    im.onerror=()=>{ui.logoErr='No pudimos abrir esa imagen. Prueba con PNG o JPG.';render({})};
    im.onload=()=>{
      const sc=Math.min(1,320/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);
      try{S.brand.logo={d:cv.toDataURL('image/png'),w,h};persist();render({});toast('Logo guardado')}catch(e){ui.logoErr='No pudimos procesar la imagen.';render({})}
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ----- campos ----- */
function setFe(k,m){ui.fe[k]=m;const s=document.getElementById('fe-'+k);if(s)s.textContent=m||''}
document.addEventListener('input',e=>{
  const t=e.target,f=t.dataset&&t.dataset.f;if(!f||t.type==='file')return;
  const i=f.indexOf(':'),g=f.slice(0,i),k=f.slice(i+1),val=t.type==='checkbox'?t.checked:t.value;
  try{
    if(g==='b')S.brand[k]=val;
    else if(g==='r'){
      S.rules[k]=(k==='curCustom')?String(val).toUpperCase():val;
      if(/Pct$/.test(k)){const n=parseFloat(String(val).replace(',','.'));setFe(k,String(val).trim()&&(!isFinite(n)||n<0||n>100)?'Escribe un porcentaje entre 0 y 100.':'')}
      if(k==='validity'){const n=parseInt(val,10);setFe(k,String(val).trim()&&(!isFinite(n)||n<1)?'Escribe un número de días de 1 o más.':'')}
      if(k==='curCustom')setFe(k,val&&!/^[A-Za-z]{3}$/.test(val)?'Usa 3 letras, por ejemplo BRL.':'');
    }
    else if(g==='sd'){ui.sd[k]=val;if(ui.fe[k])setFe(k,'')}
    else if(g==='q'){getDraft()[k]=val;if(k==='subject'||k==='adjWhy'||k==='adjAmt'){if(ui.fe.adj&&k==='adjAmt')setFe('adj','');if(k==='adjAmt'||k==='adjWhy')updLive()}}
    else if(g==='c'){getDraft().client[k]=val;if(k==='name')setFe('cname','');if(k==='email')setFe('cemail','')}
    else if(g==='qty'){
      const d=getDraft(),l=d.lines[+k],n=parseInt(String(val).replace(/\D/g,''),10);
      if(!l)return;
      if(!isFinite(n)||n<1){setFe('qty'+k,'Escribe una cantidad entera de 1 o más.')}
      else{l.qty=Math.min(999,n);setFe('qty'+k,'');updLive()}
    }
    else if(g==='status'){const q=quoteById(k);if(q)q.status=val}
    persist();
    if(t.dataset.rr)render({});
  }catch(err){console.error(err)}
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.f)return;
  if(t.dataset.f==='logo'){loadLogo(t.files&&t.files[0]);t.value='';return}
  if(t.dataset.f.startsWith('qty:')){const l=getDraft().lines[+t.dataset.f.slice(4)];if(l){t.value=l.qty;setFe('qty'+t.dataset.f.slice(4),'')}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)closeModal()});

/* ============ ARRANQUE ============ */
(function(){
  const t=document.createElement('div');t.id='toasts';t.className='toasts';t.setAttribute('role','status');t.setAttribute('aria-live','polite');document.body.appendChild(t);
  load();
  if(!['home','catalog','quote','list','qdetail'].includes(S.view))S.view='home';
  if(S.view==='qdetail'&&!quoteById(S.openQ))S.view='list';
  render({anim:true});
})();
</script>
